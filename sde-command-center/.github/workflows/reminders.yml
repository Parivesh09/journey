name: SDE Reminder Cron

on:
  schedule:
    # GitHub cron uses UTC. These are 08:00, 12:00, 16:00, 20:00, and 00:00 IST.
    - cron: "30 2,6,10,14,18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder API
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --location --request POST "$CRON_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json"
